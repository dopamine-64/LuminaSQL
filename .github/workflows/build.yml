name: Build & Release LuminaSQL

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend (Windows)
        if: runner.os == 'Windows'
        run: |
          cd backend
          pyinstaller main.py --onefile --name main `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=uvicorn.protocols.websockets `
            --hidden-import=uvicorn.protocols.websockets.auto `
            --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=sqlalchemy.dialects.mysql `
            --hidden-import=pymysql

      - name: Build Backend (macOS)
        if: runner.os == 'macOS'
        run: |
          cd backend
          pyinstaller main.py --onefile --name main \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=sqlalchemy.dialects.mysql \
            --hidden-import=pymysql

      - name: Install Node Modules
        run: npm ci

      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LuminaSQL-Windows
          path: dist/*.exe

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LuminaSQL-macOS
          path: dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminaSQL-Windows
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminaSQL-macOS
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LuminaSQL ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## LuminaSQL ${{ github.ref_name }}

            ### Downloads

            **Windows**
            - Download the `.exe` installer

            **macOS**
            - M1 / M2 / M3 / M4 (Apple Silicon) → download the `arm64.dmg` file
            - Intel Mac → download the `.dmg` file (without arm64)

            > If macOS blocks the app: right-click → Open → click **Open anyway**
            > Or run in Terminal: `xattr -cr /Applications/LuminaSQL.app`

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}